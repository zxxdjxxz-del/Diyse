name: Probe Godot v0.02 Battle Runtime

on:
  pull_request:
    paths:
      - "ci/godot-v0.02/**"
      - ".github/workflows/probe-godot-battle-v0.02.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-battle-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-battle-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.1"
      PROJECT_DIR: "The_Role_of_the_Diyse_Godot_Prototype_v0.02"
      REPAIR_SHA256: "d4ddb887a1876afcd7877a86b617e12ec25435a2479eac2f0ef0c2d75469f78d"
      BATTLE_SCENE_SHA256: "f9a391784df0bd24afa2e9d0ad1ee5739827e4c6d25a131fc80ebd519c977ea8"

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Reconstruct current QA project
        shell: bash
        run: |
          set -euo pipefail
          cat ci/godot-v0.02/project.part.*.b64 | base64 --decode > /tmp/godot-v0.02.zip
          unzip -qq -o /tmp/godot-v0.02.zip || true
          echo "${REPAIR_SHA256}  ci/godot-v0.02/repairs/battle_simulator.gd" | sha256sum --check --strict
          cp ci/godot-v0.02/repairs/battle_simulator.gd "${PROJECT_DIR}/src/core/battle_simulator.gd"

          JOYSTICK="${PROJECT_DIR}/src/ui/virtual_joystick.gd"
          RUIN="${PROJECT_DIR}/src/scenes/ruin_scene.gd"
          BATTLE="${PROJECT_DIR}/src/scenes/battle_scene.gd"
          PROJECT_SETTINGS="${PROJECT_DIR}/project.godot"
          sed -i 's/^class_name VirtualJoystick$/class_name DiyseVirtualJoystick/' "${JOYSTICK}"
          sed -i 's/VirtualJoystick/DiyseVirtualJoystick/g' "${RUIN}"
          if grep -q '^textures/vram_compression/import_etc2_astc=' "${PROJECT_SETTINGS}"; then
            sed -i 's|^textures/vram_compression/import_etc2_astc=.*$|textures/vram_compression/import_etc2_astc=true|' "${PROJECT_SETTINGS}"
          else
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' "${PROJECT_SETTINGS}"
          fi
          python ci/godot-v0.02/repairs/apply_qa_fixes.py "${PROJECT_DIR}"
          cat ci/godot-v0.02/repairs/battle_scene.part.* > "${BATTLE}"
          echo "${BATTLE_SCENE_SHA256}  ${BATTLE}" | sha256sum --check --strict

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ROOT="${RUNNER_TEMP}/godot"
          mkdir -p "${GODOT_ROOT}"
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "${GODOT_ROOT}"
          mv "${GODOT_ROOT}/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "${GODOT_ROOT}/godot"
          chmod +x "${GODOT_ROOT}/godot"
          echo "GODOT_BIN=${GODOT_ROOT}/godot" >> "${GITHUB_ENV}"
          "${GODOT_ROOT}/godot" --version

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          "${GODOT_BIN}" --headless --editor --path "${PROJECT_DIR}" --import --quit-after 20 --verbose 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" godot-import.log

      - name: Instantiate battle scene and capture runtime errors
        shell: bash
        run: |
          set -o pipefail
          "${GODOT_BIN}" \
            --headless \
            --path "${PROJECT_DIR}" \
            --quit-after 120 \
            --verbose \
            res://src/scenes/battle_scene.tscn 2>&1 | tee battle-runtime.log
          ! grep -E "SCRIPT ERROR|Invalid call|Invalid assignment|Invalid access|ERROR:" battle-runtime.log

      - name: Upload runtime probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-v0.02.2-battle-runtime-probe
          path: |
            godot-import.log
            battle-runtime.log
          if-no-files-found: warn
          retention-days: 7
