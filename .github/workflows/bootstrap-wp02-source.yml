name: Bootstrap WP-02 Source Package

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-wp02-source.yml"
      - "ci/godot-v0.02/wp02-transport/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-wp02-source
  cancel-in-progress: false

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: "agent/godot-wp02"
      PAYLOAD_SHA256: "4f86a36ce81a96e40ab8b8d37dcec616c19ccad55de4644e395d75f1adca67b6"

    steps:
      - name: Check out WP-02 branch
        uses: actions/checkout@v4
        with:
          ref: agent/godot-wp02
          fetch-depth: 0

      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail
          cat ci/godot-v0.02/wp02-transport/payload.part.* | base64 --decode > /tmp/wp02-source.tar.xz
          sha256sum /tmp/wp02-source.tar.xz
          echo "${PAYLOAD_SHA256}  /tmp/wp02-source.tar.xz" | sha256sum --check --strict
          tar -tJf /tmp/wp02-source.tar.xz
          tar -xJf /tmp/wp02-source.tar.xz
          test -f ci/godot-v0.02/wp02/save_foundation.gd
          test -f ci/godot-v0.02/wp02/wp02_save_regression_test.gd
          test -f ci/godot-v0.02/wp02/run_wp02_ci.sh
          python ci/godot-v0.02/wp02/validate_wp02_contract.py ci/godot-v0.02/wp02
          ! find ci/godot-v0.02/wp02 -type d -name __pycache__ -print -quit | grep -q .
          ! find ci/godot-v0.02/wp02 -type f -name '*.pyc' -print -quit | grep -q .

      - name: Commit reconstructed WP-02 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Diyse WP-02 Source Publication"
          git config user.email "actions@users.noreply.github.com"
          git add ci/godot-v0.02/wp02
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$'
          git commit -m "Add WP-02 save and migration foundation"
          git push origin HEAD:refs/heads/${TARGET_BRANCH}
