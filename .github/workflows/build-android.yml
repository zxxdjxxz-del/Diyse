name: Build Diyse Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reconstruct source archive
        run: |
          cat source_parts/source.part.* > Diyse_Source.zip
          mkdir source
          unzip -q Diyse_Source.zip -d source
          test -f source/settings.gradle

      - name: Patch prototype compatibility issues
        run: |
          python - <<'PY'
          from pathlib import import Path
          PY
