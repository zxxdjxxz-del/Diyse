name: Build Diyse Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reconstruct source archive
        run: |
          cat source_parts/source.part.* > Diyse_Source.zip
          mkdir source
          unzip -q Diyse_Source.zip -d source
          test -f source/settings.gradle

      - name: Run combat and progression tests
        working-directory: source
        run: gradle --no-daemon :core:test

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :android:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Diyse-Prototype-v0.01-APK
          path: source/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
