name: Bootstrap WP-01R Publication

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-wp01r-publication.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-wp01r-publication
  cancel-in-progress: false

jobs:
  publish-coherent-wp01r-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_SHA: "067ed58481d8ea8315cfdf622aebd58d9ce19575"
      TARGET_BRANCH: "agent/godot-wp01r"
      PACKAGE_URL: "https://diyse-wp01r-38dd261d.serveo.net/Diyse_WP01R_Godot_Baseline_Reconciliation_v0.1_Proposed_2026-08-03.zip"
      PACKAGE_SHA256: "38dd261d6c1a6f211f437026eb239f4d3649f38958682d7ca62b40fab88b5007"
      AUTHORITY_ZIP_SHA256: "2b94b6e6ca54a34fc9c85389ff1bdfd203591fdbd1ad81f9e27d88158596f760"

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact WP-01R package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --output /tmp/wp01r-package.zip "${PACKAGE_URL}"
          echo "${PACKAGE_SHA256}  /tmp/wp01r-package.zip" | sha256sum --check --strict
          unzip -t /tmp/wp01r-package.zip
          rm -rf /tmp/wp01r-package
          mkdir -p /tmp/wp01r-package
          unzip -q /tmp/wp01r-package.zip -d /tmp/wp01r-package
          OVERLAY_DIR="$(find /tmp/wp01r-package -type d -name repo_overlay -print -quit)"
          test -n "${OVERLAY_DIR}"
          test -d "${OVERLAY_DIR}/ci/godot-v0.02/wp01r"
          echo "OVERLAY_DIR=${OVERLAY_DIR}" >> "${GITHUB_ENV}"

      - name: Confirm target branch is still untouched baseline
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${REMOTE_SHA}" = "${BASELINE_SHA}"

      - name: Apply exact repository overlay without generated caches
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${BASELINE_SHA}"
          git clean -fdx
          cp -a "${OVERLAY_DIR}/." "${GITHUB_WORKSPACE}/"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          ! find . -type d -name __pycache__ -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .
          test -f .github/workflows/build-godot-v0.03.0-wp01r.yml
          test -f ci/godot-v0.02/wp01r/authority_manager.gd
          test -f ci/godot-v0.02/wp01r/validate_authority.py

      - name: Verify exact authority archive before commit
        shell: bash
        run: |
          set -euo pipefail
          cat ci/godot-v0.02/wp01r/authority.part.*.b64 | base64 --decode > /tmp/diyse-authority-v1.11.zip
          echo "${AUTHORITY_ZIP_SHA256}  /tmp/diyse-authority-v1.11.zip" | sha256sum --check --strict
          unzip -t /tmp/diyse-authority-v1.11.zip

      - name: Create and publish one coherent WP-01R commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Diyse WP-01R Publication"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$'
          git commit -m "Add Godot WP-01R authority import candidate"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${BASELINE_SHA}" \
            "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Published ${NEW_SHA} to ${TARGET_BRANCH}"
