name: Build Godot v0.04.0 WP-02 Runtime-Verified APK

on:
  pull_request:
    paths:
      - "ci/godot-v0.02/**"
      - ".github/workflows/build-godot-v0.04.0-wp02.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-v0.04.0-wp02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-ui-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_DIR: "The_Role_of_the_Diyse_Godot_Prototype_v0.02"

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Reconstruct UI source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/godot-v0.02/project.part.*.b64 | base64 --decode > /tmp/godot-v0.02.zip
          unzip -qq -o /tmp/godot-v0.02.zip
          mkdir -p inspection/src/autoload inspection/src/scenes inspection/repairs
          cp "${PROJECT_DIR}/src/autoload/save_manager.gd" inspection/src/autoload/
          cp "${PROJECT_DIR}/src/autoload/game_state.gd" inspection/src/autoload/
          cp "${PROJECT_DIR}/src/scenes/title.gd" inspection/src/scenes/
          cp "${PROJECT_DIR}/src/scenes/title.tscn" inspection/src/scenes/
          cp "${PROJECT_DIR}/src/scenes/ruin_scene.gd" inspection/src/scenes/
          cp "${PROJECT_DIR}/src/scenes/ruin_scene.tscn" inspection/src/scenes/
          cp "${PROJECT_DIR}/src/scenes/battle_scene.gd" inspection/src/scenes/
          cp "${PROJECT_DIR}/src/scenes/battle_scene.tscn" inspection/src/scenes/
          cp ci/godot-v0.02/repairs/apply_battle_ui_v0025.py inspection/repairs/
          cp ci/godot-v0.02/repairs/apply_battle_polish.py inspection/repairs/

      - name: Upload UI integration source
        uses: actions/upload-artifact@v4
        with:
          name: WP02-UI-Integration-Inspection-Source
          path: inspection/
          if-no-files-found: error
          retention-days: 3

  build-runtime-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.1"
      PROJECT_DIR: "The_Role_of_the_Diyse_Godot_Prototype_v0.02"
      APK_NAME: "The_Role_of_the_Diyse_v0.04.0_WP02_QA.apk"
      SIMULATOR_SHA256: "ca6cdb5aa2fa65031dd4d41bc53ce2f3a55c7bb1c50b8ca08da3ea23d893c59a"
      BATTLE_SCENE_SHA256: "f9a391784df0bd24afa2e9d0ad1ee5739827e4c6d25a131fc80ebd519c977ea8"
      AUTHORITY_ZIP_SHA256: "89bb3e75aa2658471bf1a092901fb69adcc1dd44059db8d1a96685e8f305fc19"

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and verify WP-02
        shell: bash
        run: bash ci/godot-v0.02/wp02/run_wp02_ci.sh

      - name: Upload v0.04.0 WP-02 APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Role-of-the-Diyse-Godot-v0.04.0-WP02-Runtime-Verified-APK
          path: android-artifact/
          if-no-files-found: error
          retention-days: 14
