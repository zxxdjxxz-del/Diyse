name: Build Godot v0.04.1 WP-02R Device-Integrated APK

on:
  pull_request:
    paths:
      - "ci/godot-v0.02/**"
      - ".github/workflows/build-godot-v0.04.0-wp02.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-v0.04.1-wp02r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-device-integrated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.1"
      PROJECT_DIR: "The_Role_of_the_Diyse_Godot_Prototype_v0.02"
      APK_NAME: "The_Role_of_the_Diyse_v0.04.1_WP02R_QA.apk"
      SIMULATOR_SHA256: "ca6cdb5aa2fa65031dd4d41bc53ce2f3a55c7bb1c50b8ca08da3ea23d893c59a"
      BATTLE_SCENE_SHA256: "f9a391784df0bd24afa2e9d0ad1ee5739827e4c6d25a131fc80ebd519c977ea8"
      AUTHORITY_ZIP_SHA256: "89bb3e75aa2658471bf1a092901fb69adcc1dd44059db8d1a96685e8f305fc19"

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and verify WP-02R
        shell: bash
        run: bash ci/godot-v0.02/wp02/run_wp02_ci.sh

      - name: Upload v0.04.1 WP-02R APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Role-of-the-Diyse-Godot-v0.04.1-WP02R-Device-Integrated-APK
          path: android-artifact/
          if-no-files-found: error
          retention-days: 14
